  </defs>
  <rect width="128" height="128" fill="url(#vb-core)"/>
  <rect width="128" height="128" fill="url(#vb-silver1)"/>
  <rect width="128" height="128" fill="url(#vb-blue2)"/>
  <rect width="128" height="128" fill="url(#vb-blue1)"/>
  <rect width="128" height="128" fill="url(#vb-peach2)"/>
  <rect width="128" height="128" fill="url(#vb-peach1)"/>
