<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Static vector illustration of the VailieMark idle blob (see
       src/sidepanel/components/VailieMark.tsx MESH.idle for the canonical
       CSS recipe this mirrors). Not part of the build: the shipped extension
       icons (icon-16/32/48/128.png) are hand-authored via
       scripts/render-icons.html, not rasterized from this file. This SVG is
       only a vector reference used by README hero images. -->
  <defs>
    <radialGradient id="vb-peach1" cx="54%" cy="42%" r="24%">
      <stop offset="0%" stop-color="#FFB3C2" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFB3C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vb-peach2" cx="66%" cy="26%" r="26%">
      <stop offset="0%" stop-color="#FFB3C2" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#FFB3C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vb-blue1" cx="36%" cy="56%" r="34%">
      <stop offset="0%" stop-color="#7CB8FF" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#7CB8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vb-blue2" cx="58%" cy="72%" r="40%">
      <stop offset="0%" stop-color="#7CB8FF" stop-opacity=".55"/>
