name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build and attach zip to'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify eval harness is NOT in the production bundle
        # Pure Node string-scan of dist/ (no docker / Playwright / Python needed).
        # The dev-only eval bridge must be tree-shaken out of `pnpm build`; this
        # guard fails the release if it ever leaks in. See eval/README.md.
        run: pnpm verify:no-eval-bridge

      - name: Verify manifest references compiled assets
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            const sw = m.background.service_worker;
            const cs = m.content_scripts[0].js[0];
            if (sw.endsWith('.ts') || cs.endsWith('.ts')) {
              console.error('FAIL: manifest still references .ts files', { sw, cs });
              process.exit(1);
            }
            if (m.version !== '${{ steps.tag.outputs.version }}') {
              console.error('FAIL: manifest version', m.version, '!= tag version ${{ steps.tag.outputs.version }}');
              process.exit(1);
            }
            console.log('OK', { version: m.version, sw, cs });
          "

      - name: Package zip
        run: |
          find dist -name '.DS_Store' -delete || true
          (cd dist && zip -rq "../pie-${{ steps.tag.outputs.version }}.zip" .)
          ls -la pie-${{ steps.tag.outputs.version }}.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.ref }}" \
            "pie-${{ steps.tag.outputs.version }}.zip" \
            --clobber

  # daemon 版本闸：daemon/ 相对上一个 tag 有改动，daemon/package.json 的 version 就必须跟着动。
  # 为什么需要：daemon 是高频改动面，但 /usr/local/bin/pie 只能靠用户重装 pkg 更新，而
  # 「有没有新版」全靠版本号比较（扩展侧 MIN_DAEMON_VERSION、pkg 文件名、doctor 显示的
  # v<ver>）。版本号不动 = 所有这些判断同时失明，连用户跑的是哪个二进制都问不出来。
  # 闸在 release 级（不是 PR 级）：一个 feature 拆 N 个 PR 不该跳 N 个版本，攒一批发版时对齐即可。
  daemon-version-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # 需要完整历史 + tags 才能和上一个 tag 比

      - name: daemon/ changed ⇒ daemon version must change
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # 补传历史 tag（workflow_dispatch）是重建既成事实，版本关系当时就定了，不复查。
          # 判断放 step 内而非 job 级 if：job 被 skip 会连带 skip 掉 needs 它的构建 job。
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "workflow_dispatch rebuild — gate skipped"; exit 0
          fi
          CUR="${GITHUB_REF_NAME}"
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -A1 -x "$CUR" | tail -n1)"
          if [ -z "$PREV" ] || [ "$PREV" = "$CUR" ]; then
            echo "no previous v* tag — first release, gate skipped"; exit 0
          fi
          echo "comparing $PREV → $CUR"
          if git diff --quiet "$PREV" "$CUR" -- daemon/; then
            echo "daemon/ unchanged — gate passed"; exit 0
          fi
          # 上一个 tag 里还没有 daemon/package.json（daemon 那时刚引入）→ 无从比较，放行。
          # 2>/dev/null + || true：set -e 下 git show 失败会让闸误报 fail。
          PREV_V="$(git show "$PREV:daemon/package.json" 2>/dev/null | jq -r .version || true)"
          CUR_V="$(git show "$CUR:daemon/package.json" | jq -r .version)"
          if [ -z "$PREV_V" ] || [ "$PREV_V" = "null" ]; then
            echo "no daemon/package.json at $PREV — gate passed"; exit 0
          fi
          if [ "$PREV_V" = "$CUR_V" ]; then
            echo "::error::daemon/ changed since $PREV but daemon/package.json version is still $CUR_V. Bump it — users can only get the new binary via a version-named pkg, and every 'is there an update' check compares this number."
            git diff --stat "$PREV" "$CUR" -- daemon/
            exit 1
          fi
          echo "daemon version $PREV_V → $CUR_V — gate passed"

  build-daemon-pkg:
    runs-on: macos-14
    needs: daemon-version-gate
    # #403：把版本号 + macOS 自更新物 zip 的 sha256 暴露给 daemon-latest-json 汇总 job。
    outputs:
      version: ${{ steps.dv.outputs.version }}
      macos_sha: ${{ steps.zipsha.outputs.sha }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Daemon tests
        run: cd daemon && bun install --frozen-lockfile && bun test

      - name: Read daemon version
        id: dv
        run: echo "version=$(jq -r .version daemon/package.json)" >> "$GITHUB_OUTPUT"

      - name: Import signing certs into temp keychain
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
        run: daemon/install/release-pkg.sh gpccjhdgjkmalnepmeclooflliiocfed "${{ steps.dv.outputs.version }}"

      - name: Hash macOS update zip
        id: zipsha
        # #403 自更新 sha256 硬闸的期望值来源：release-pkg.sh 产出的已签名 pie-darwin-universal.zip。
        run: echo "sha=$(shasum -a 256 daemon/dist/pie-darwin-universal.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "daemon/dist/pie-link-${{ steps.dv.outputs.version }}.pkg" pie-link.pkg
          gh release upload "${{ steps.tag.outputs.ref }}" \
            "daemon/dist/pie-link-${{ steps.dv.outputs.version }}.pkg" \
            pie-link.pkg \
            "daemon/dist/pie-darwin-universal.zip" \
            --clobber

      - name: Verify pkg + update-zip assets reachable
        run: |
          sleep 5
          for asset in pie-link.pkg pie-darwin-universal.zip; do
            curl -fsSIL -o /dev/null --retry 3 --retry-delay 5 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.ref }}/$asset"
          done

  build-daemon-win:
    runs-on: windows-latest
    needs: daemon-version-gate
    # #403：把 Windows 安装器 sha256 暴露给 daemon-latest-json 汇总 job（托盘检查更新用它做 best-effort 校验）。
    outputs:
      windows_sha: ${{ steps.winsha.outputs.sha }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Read daemon version
        id: dv
        shell: bash
        run: echo "version=$(node -p "require('./daemon/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compile pie.exe + stage sandbox / redist payload
        shell: bash
        working-directory: daemon
        env:
          VER: ${{ steps.dv.outputs.version }}
        run: |
          bun install --frozen-lockfile
          mkdir -p dist
          # bun-windows-x64 single binary; version defined in at compile time (spec 6).
          bun build ./src/cli.ts --compile --target=bun-windows-x64 \
            --define "process.env.PIE_DAEMON_VERSION=\"$VER\"" \
            --outfile dist/pie.exe
          # srt-win.exe is a companion file (no vendored fallback in a bun single binary; F1/6.1).
          cp node_modules/@anthropic-ai/sandbox-runtime/vendor/srt-win/x64/srt-win.exe dist/
          # vc_redist prerequisite (F1: srt-win links VCRUNTIME140.dll).
          curl -fSL -o dist/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          ls -la dist

      - name: Build tray (PieTray.exe)
        shell: pwsh
        run: daemon\tray-win\build-tray.ps1 -OutDir daemon\dist -Version ${{ steps.dv.outputs.version }}

      - name: Install Inno Setup
        shell: pwsh
        # Pin the version: the ISCC path below is hardcoded to "Inno Setup 6". Inno Setup 7.0.x is
        # already published; once the choco package follows the major bump, choco installs into
        # "Inno Setup 7" and the packaging step can no longer find ISCC.exe -- a failure that only
        # surfaces at tag-push time (installer silently missing from the release). Pinning keeps the
        # build reproducible, matching the srt exact-pin convention. Bump both this pin and the path
        # below together when intentionally moving to Inno Setup 7.
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Package installer (iscc)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.dv.outputs.version }}" daemon\install-win\pie-link.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit $LASTEXITCODE" }
          Get-ChildItem daemon\dist\pie-link-setup-*.exe

      # --- Code signing placeholder (spec decision 9): first release ships unsigned; wire signtool
      #     here once a cert is in secrets (sign pie.exe / PieTray.exe pre-package + the setup exe).

      - name: Stable-name + hash installer
        id: winsha
        shell: bash
        # #403：除版本名安装器外，再产一个固定名 pie-link-setup.exe，供扩展升级卡 WIN_SETUP_URL
        # 与托盘「检查更新」的 /latest/download/ 稳定别名命中；并算 sha256 交汇总 job 写进 latest.json。
        run: |
          cp "daemon/dist/pie-link-setup-${{ steps.dv.outputs.version }}.exe" daemon/dist/pie-link-setup.exe
          echo "sha=$(sha256sum daemon/dist/pie-link-setup.exe | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.ref }}" \
            "daemon/dist/pie-link-setup-${{ steps.dv.outputs.version }}.exe" \
            "daemon/dist/pie-link-setup.exe" \
            --clobber

      - name: Verify installer assets reachable
        shell: bash
        run: |
          sleep 5
          for asset in "pie-link-setup-${{ steps.dv.outputs.version }}.exe" pie-link-setup.exe; do
            curl -fsSIL -o /dev/null --retry 3 --retry-delay 5 --retry-all-errors \
              "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.ref }}/$asset"
          done

  # #403 自更新 appcast：汇总 mac + win 两 job 的版本号与 sha256，生成固定名 pie-link-latest.json。
  # daemon checkUpdate / 托盘检查更新 / 扩展升级卡都从 /releases/latest/download/pie-link-latest.json 读它。
  daemon-latest-json:
    runs-on: ubuntu-latest
    needs: [build-daemon-pkg, build-daemon-win]
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build + upload pie-link-latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${{ needs.build-daemon-pkg.outputs.version }}"
          MAC_SHA="${{ needs.build-daemon-pkg.outputs.macos_sha }}"
          WIN_SHA="${{ needs.build-daemon-win.outputs.windows_sha }}"
          BASE="https://github.com/${{ github.repository }}/releases/latest/download"
          [ -n "$VER" ] && [ -n "$MAC_SHA" ] && [ -n "$WIN_SHA" ] || {
            echo "::error::missing version/sha inputs (VER=$VER MAC_SHA=$MAC_SHA WIN_SHA=$WIN_SHA)"; exit 1; }
          cat > pie-link-latest.json <<EOF
          {
            "version": "$VER",
            "macos": { "url": "$BASE/pie-darwin-universal.zip", "sha256": "$MAC_SHA" },
            "windows": { "url": "$BASE/pie-link-setup.exe", "sha256": "$WIN_SHA" }
          }
          EOF
          cat pie-link-latest.json
          gh release upload "${{ steps.tag.outputs.ref }}" pie-link-latest.json --clobber

      - name: Verify latest.json asset reachable
        run: |
          sleep 5
          curl -fsSIL -o /dev/null --retry 3 --retry-delay 5 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.ref }}/pie-link-latest.json"
