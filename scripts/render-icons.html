<!-- scripts/render-icons.html — open in a browser (or drive headlessly via Playwright),
     draws the 4 extension-icon sizes on <canvas id="canvas-{size}"> and offers download
     links. MESH recipe = VailieMark idle (128/48) with a tighter-decay variant for the
     small sizes (32/16) so the blob still reads as a distinct colour cluster at toolbar
     scale — see src/sidepanel/components/VailieMark.tsx MESH.idle for the source recipe
     this is hand-tuned from. Zero dependencies; this file is not part of the Vite build. -->
<!doctype html>
<meta charset="utf-8" />
<title>Vailie icon exporter</title>
<body style="font-family:sans-serif;background:#20232a;color:#eee;padding:16px">
<h1 style="font-size:14px;font-weight:600">Vailie extension icon exporter</h1>
<p style="font-size:12px;color:#9aa;max-width:60ch">Each canvas is rendered at its native pixel size (no CSS upscaling) on a checkerboard so alpha edges and toolbar-scale legibility are visible as-is. Click a link to download that PNG.</p>
<div id="grid" style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap"></div>
<script>
const LAYERS_LARGE = [ // idle recipe (same lineage as VailieMark.tsx MESH.idle)
  ["rgba(255,179,194,.35)", .54, .42, .24], ["rgba(255,179,194,.65)", .66, .26, .26],
  ["rgba(124,184,255,.65)", .36, .56, .34], ["rgba(124,184,255,.55)", .58, .72, .40],
  ["rgba(213,222,231,.85)", .30, .28, .28], ["rgba(199,210,222,1)", .50, .46, .56],
];
const LAYERS_SMALL = [ // tighter decay: small-icon core stays solid, legibility over nuance
  ["rgba(255,159,178,1)", .54, .30, .30], ["rgba(124,184,255,.9)", .40, .60, .44],
  ["rgba(196,208,222,1)", .50, .48, .52],
];
const RADIUS_FACTOR_SMALL = 1.3; // tighter than LARGE's 1.7 — keeps the small-icon core solid
const RADIUS_FACTOR_LARGE = 1.7;

function draw(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  c.id = `canvas-${size}`;
  c.style.background =
    "repeating-conic-gradient(#3a3f47 0% 25%, #2a2e35 0% 50%) 0 0 / 8px 8px";
  const ctx = c.getContext("2d");
  const small = size < 48;
  const layers = small ? LAYERS_SMALL : LAYERS_LARGE;
  const radiusFactor = small ? RADIUS_FACTOR_SMALL : RADIUS_FACTOR_LARGE;
  for (const [color, x, y, r] of [...layers].reverse()) {
    const g = ctx.createRadialGradient(
      x * size, y * size, 0,
      x * size, y * size, r * size * radiusFactor
    );
    g.addColorStop(0, color);
    g.addColorStop(1, color.replace(/[\d.]+\)$/, "0)"));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  }

  const wrap = document.createElement("div");
  wrap.style.textAlign = "center";
  const label = document.createElement("div");
  label.style.fontSize = "11px";
  label.style.marginBottom = "4px";
  label.textContent = `${size}px`;
  const a = document.createElement("a");
  a.href = c.toDataURL("image/png");
  a.download = `icon-${size}.png`;
  a.style.display = "block";
  a.style.marginTop = "4px";
  a.style.fontSize = "11px";
  a.style.color = "#7cb8ff";
  a.textContent = "download";
  wrap.append(label, c, a);
  document.getElementById("grid").append(wrap);
}

[128, 48, 32, 16].forEach(draw);
</script>
</body>
